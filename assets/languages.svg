<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Top Languages</title>
  <desc id="desc">Language statistics are generated automatically after the first GitHub Actions run.</desc>
  <rect x="1" y="1" width="758" height="298" rx="16" fill="#0d1117" stroke="#263246"/>
  <text x="28" y="42" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">Top Languages</text>
  <text x="28" y="70" fill="#7f8ea3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Waiting for the first automatic data refresh</text>
  <line x1="28" y1="88" x2="732" y2="88" stroke="#202b3b"/>
  <text x="28" y="129" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">No language data yet</text>
  <rect x="28" y="150" width="704" height="10" rx="5" fill="#161f2d"/>
  <text x="28" y="200" fill="#7aa2f7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Generated from repository language bytes</text>
  <text x="28" y="228" fill="#59677b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">No hard-coded percentages.</text>
</svg>
