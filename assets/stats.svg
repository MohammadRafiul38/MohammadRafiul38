<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Statistics</title>
  <desc id="desc">Statistics are generated automatically after the first GitHub Actions run.</desc>
  <rect x="1" y="1" width="758" height="298" rx="16" fill="#0d1117" stroke="#263246"/>
  <text x="28" y="42" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">GitHub Statistics</text>
  <text x="28" y="70" fill="#7f8ea3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Waiting for the first automatic data refresh</text>
  <line x1="28" y1="89" x2="500" y2="89" stroke="#202b3b"/>
  <text x="28" y="124" fill="#7aa2f7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">REPOSITORIES</text>
  <text x="28" y="158" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">—</text>
  <text x="28" y="202" fill="#7aa2f7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">STARS</text>
  <text x="28" y="236" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">—</text>
  <text x="280" y="124" fill="#ff7ab2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">COMMITS</text>
  <text x="280" y="158" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">—</text>
  <text x="280" y="202" fill="#ff7ab2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">PULL REQUESTS</text>
  <text x="280" y="236" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">—</text>
  <circle cx="640" cy="153" r="70" fill="none" stroke="#172131" stroke-width="12"/>
  <circle cx="640" cy="153" r="70" fill="none" stroke="#7aa2f7" stroke-width="12" stroke-dasharray="130 310" transform="rotate(-70 640 153)"/>
  <circle cx="640" cy="153" r="70" fill="none" stroke="#c05acb" stroke-width="12" stroke-dasharray="85 355" transform="rotate(5 640 153)"/>
  <text x="640" y="151" text-anchor="middle" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700">AUTO</text>
  <text x="640" y="176" text-anchor="middle" fill="#7f8ea3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">UPDATED</text>
</svg>
