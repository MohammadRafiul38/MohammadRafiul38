<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 240" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Contribution Activity</title>
  <desc id="desc">Contribution activity will be generated automatically after the first GitHub Actions run.</desc>
  <rect x="1" y="1" width="1398" height="238" rx="16" fill="#0d1117" stroke="#263246"/>
  <text x="28" y="42" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">GitHub Contribution Activity</text>
  <text x="1320" y="42" text-anchor="end" fill="#7f8ea3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Last 12 months</text>
  <text x="28" y="112" fill="#7aa2f7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Waiting for GitHub contribution data...</text>
  <g transform="translate(260 88)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#161f2d"/>
    <rect x="20" y="0" width="12" height="12" rx="2" fill="#1a3a38"/>
    <rect x="40" y="0" width="12" height="12" rx="2" fill="#20826c"/>
    <rect x="60" y="0" width="12" height="12" rx="2" fill="#2fbf76"/>
    <rect x="80" y="0" width="12" height="12" rx="2" fill="#56e39f"/>
  </g>
  <text x="28" y="156" fill="#59677b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Less</text>
  <text x="348" y="156" fill="#59677b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">More</text>
</svg>
